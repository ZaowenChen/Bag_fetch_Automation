[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bagfetcher"
version = "0.1.0"
description = "GUI tool to fetch robot bag files via SSH"
readme = "README.md"
authors = [{ name = "Bag Fetcher Team" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "paramiko>=3.3",
    "keyring>=24.3",
    "python-dateutil>=2.9",
    "loguru>=0.7",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bagfetcher*"]
